<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My title</title>
  </head>
  <body class="container desktop">
    <h1>My header</h1>
    <a href="#">My link</a>

    <div id="content"></div>

    <button onclick="handleToggleTheme()">Toggle Theme</button>

    <script>
      function handleToggleTheme() {
        console.log(document.body.classList);

        const isLight = document.body.classList.contains("light");

        console.log(isLight);

        // if (isLight === false) {
        if (!isLight) {
          document.body.classList.add("light");
          document.body.classList.remove("dark");
        } else {
          document.body.classList.remove("light");
          document.body.classList.add("dark");
        }
      }

      // DOM
      document.querySelector("h2");

      // document.getElementById("content").innerHTML = `
      //     <h2 style="color:red; background-color:blue">Tiêu đề 2</h2>

      //     <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad, impedit?</p>
      // `;

      // Tạo ra thẻ h2 có nội dung: Tiêu đề 2

      // 1. tạo ra thẻ h2
      const h2el = document.createElement("h2");

      // 2. thêm nội dung vào cho thẻ h2
      h2el.textContent = "Tiêu đề 2";
      h2el.className = "h2";
      h2el.style.cssText = "color:red; background-color: blue; font-size: 50px";

      //
      const pEl = document.createElement("p");
      pEl.textContent =
        "Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad, impedit?";

      const contentEle = document.getElementById("content");

      // Thêm element vào bên trong thẻ div#content
      contentEle.append(h2el);
      contentEle.append(pEl);
    </script>

    <script src="../../assets/js/utils/index.js"></script>
  </body>
</html>
